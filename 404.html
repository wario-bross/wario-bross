<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Wario Bross</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/brand/favicon-48.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=League+Spartan:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Reutilizando los tokens del index.html */
    --color-fondo:#FAF8F5; --color-superficie:#FFFFFF; --color-borde:#E7E1D8;
    --color-marca-oscuro:#12121D; --color-dorado:#F6B73C; --color-cta:#D8303F; --color-cta-hover:#BF2836;
    --color-texto:#14141F; --color-texto-sutil:#5B5B68;
    --fuente-display:'Bangers', sans-serif; 
    --fuente-seccion:'League Spartan', sans-serif;
    --fuente-cuerpo:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--color-fondo); color:var(--color-texto); font-family:var(--fuente-cuerpo);
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .caja{ max-width:420px; }
  img{ width:96px; height:96px; border-radius:20px; margin:0 auto 20px; object-fit:contain; }
  h1{ 
    font-family:var(--fuente-display); font-size:72px; color:var(--color-cta); 
    letter-spacing:2px; line-height:1; margin-bottom:16px;
    text-shadow: 2px 3px 0 rgba(0,0,0,.1); 
  }
  p{ color:var(--color-texto-sutil); margin:0 auto 28px; font-size:16px; line-height:1.6; max-width:35ch; }
  .botones{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 22px; border-radius:999px; font-family:var(--fuente-seccion);
    font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.3px;
    text-decoration:none; min-height:48px; border:2px solid transparent;
    transition: transform .15s ease, background .15s ease;
  }
  a.btn:active{ transform: scale(.97); }
  .btn-primario{ background:var(--color-cta); color:#fff; box-shadow: 0 6px 18px rgba(216,48,63,0.30); }
  .btn-primario:hover{ background:var(--color-cta-hover); }
  .btn-secundario{ background:transparent; border-color:var(--color-marca-oscuro); color:var(--color-marca-oscuro); }
  .btn-secundario:hover{ background:var(--color-marca-oscuro); color:#fff; }
</style>
</head>
<body>
  <div class="caja">
    <img src="/img/brand/logo-wario-bross-512.png" alt="Logo de Wario Bross">
    <h1>404</h1>
    <p>Esta página se la comió alguien antes que tú. Pero el menú sigue completo.</p>
    <div class="botones">
      <a class="btn btn-secundario" href="/">Inicio</a>
      <a class="btn btn-secundario" href="/#menu">Ver menú</a>
      <a class="btn btn-primario" href="/#menu">🍔 Pedir ahora</a>
    </div>
  </div>
</body>
</html>
